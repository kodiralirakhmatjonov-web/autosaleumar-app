name: Register AutoSale Umar iPhone

on:
  push:
    branches: ['main']
    paths:
      - '.eas/workflows/register-iphone.yml'

jobs:
  register_device:
    name: Register iPhone
    type: apple-device-registration-request
    params:
      apple_team_identifier: 2DQ678JTNG

  next_steps:
    name: Registration complete
    needs: [register_device]
    type: doc
    params:
      md: |
        # iPhone registered

        Device registration for AutoSale Umar is complete.

        - UDID: `${{ needs.register_device.outputs.identifier }}`
        - Model: `${{ needs.register_device.outputs.model }}`
        - iOS: `${{ needs.register_device.outputs.software_version }}`

        The next step is to configure iOS signing credentials and create the first AutoSale Umar development build.
