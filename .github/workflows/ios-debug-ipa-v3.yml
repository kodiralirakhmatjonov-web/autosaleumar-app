name: Auto Sale Umar Debug IPA V3 - NO PKCS12

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autosaleumar-debug-ipa-v3
  cancel-in-progress: false

env:
  APP_SCHEME: AutoSaleUmar
  APP_BUNDLE_ID: com.autosaleumar.app
  APPLE_TEAM_ID: 2DQ678JTNG
  EXPECTED_PROFILE_NAME: Auto Sale Umar GitHub Debug

jobs:
  debug-ipa:
    name: Build signed Debug IPA V3 for registered iPhone
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm

      - name: Workflow version marker
        run: echo 'SIGNING_PIPELINE_VERSION=3-NO-PKCS12'

      - name: Validate signing secrets
        shell: bash
        env:
          CSR_KEY_PASSWORD: ${{ secrets.IOS_CSR_KEY_PASSWORD }}
          PRIVATE_KEY_ENC_BASE64: ${{ secrets.IOS_PRIVATE_KEY_ENC_BASE64 }}
          DEVELOPMENT_PROFILE_BASE64: ${{ secrets.IOS_DEVELOPMENT_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${CSR_KEY_PASSWORD:-}" || { echo 'Missing IOS_CSR_KEY_PASSWORD.' >&2; exit 1; }
          test -n "${PRIVATE_KEY_ENC_BASE64:-}" || { echo 'Missing IOS_PRIVATE_KEY_ENC_BASE64.' >&2; exit 1; }
          test -n "${DEVELOPMENT_PROFILE_BASE64:-}" || { echo 'Missing IOS_DEVELOPMENT_PROFILE_BASE64.' >&2; exit 1; }
          if [ "${#CSR_KEY_PASSWORD}" -lt 24 ]; then
            echo 'IOS_CSR_KEY_PASSWORD is unexpectedly short.' >&2
            exit 1
          fi

      - name: Restore signing identity WITHOUT PKCS12
        id: signing
        shell: bash
        env:
          CSR_KEY_PASSWORD: ${{ secrets.IOS_CSR_KEY_PASSWORD }}
          PRIVATE_KEY_ENC_BASE64: ${{ secrets.IOS_PRIVATE_KEY_ENC_BASE64 }}
          DEVELOPMENT_PROFILE_BASE64: ${{ secrets.IOS_DEVELOPMENT_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          SIGN_DIR="$RUNNER_TEMP/autosale-signing"
          KEYCHAIN_PATH="$RUNNER_TEMP/autosale-build.keychain-db"
          PROFILE="$SIGN_DIR/AutoSaleUmar.mobileprovision"
          PROFILE_PLIST="$SIGN_DIR/profile.plist"
          ENCRYPTED_KEY="$SIGN_DIR/private-key.pem.enc"
          PRIVATE_KEY="$SIGN_DIR/private-key.pem"
          MATCHING_CERT="$SIGN_DIR/development-cert.pem"

          rm -rf "$SIGN_DIR"
          mkdir -p "$SIGN_DIR"

          python3 - <<'PY'
          import base64, os, pathlib
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'autosale-signing'
          out.mkdir(parents=True, exist_ok=True)
          out.joinpath('private-key.pem.enc').write_bytes(
              base64.b64decode(os.environ['PRIVATE_KEY_ENC_BASE64'].strip(), validate=True)
          )
          out.joinpath('AutoSaleUmar.mobileprovision').write_bytes(
              base64.b64decode(os.environ['DEVELOPMENT_PROFILE_BASE64'].strip(), validate=True)
          )
          PY

          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 300000 \
            -md sha256 \
            -in "$ENCRYPTED_KEY" \
            -out "$PRIVATE_KEY" \
            -pass env:CSR_KEY_PASSWORD

          openssl pkey -in "$PRIVATE_KEY" -check -noout
          security cms -D -i "$PROFILE" > "$PROFILE_PLIST"

          python3 - "$PROFILE_PLIST" "$SIGN_DIR" <<'PY'
          import datetime as dt
          import plistlib
          import pathlib
          import sys

          plist_path = pathlib.Path(sys.argv[1])
          out_dir = pathlib.Path(sys.argv[2])
          p = plistlib.loads(plist_path.read_bytes())

          expected_team = '2DQ678JTNG'
          expected_bundle = 'com.autosaleumar.app'
          expected_name = 'Auto Sale Umar GitHub Debug'

          teams = p.get('TeamIdentifier') or []
          ent = p.get('Entitlements') or {}
          devices = p.get('ProvisionedDevices') or []
          expiration = p.get('ExpirationDate')
          certificates = p.get('DeveloperCertificates') or []

          if expected_team not in teams:
              raise SystemExit(f'Wrong TeamIdentifier: {teams!r}')
          if p.get('Name') != expected_name:
              raise SystemExit(f'Wrong profile name: {p.get("Name")!r}')
          if ent.get('application-identifier') != f'{expected_team}.{expected_bundle}':
              raise SystemExit(f'Wrong application-identifier: {ent.get("application-identifier")!r}')
          if ent.get('com.apple.developer.team-identifier') != expected_team:
              raise SystemExit('Wrong team entitlement.')
          if ent.get('get-task-allow') is not True:
              raise SystemExit('Profile is not a Development profile (get-task-allow is not true).')
          if not devices:
              raise SystemExit('Provisioning profile contains no registered iPhone devices.')
          if expiration is None or expiration <= dt.datetime.now(dt.timezone.utc).replace(tzinfo=None):
              raise SystemExit('Provisioning profile is expired.')
          if not certificates:
              raise SystemExit('Provisioning profile contains no development certificates.')

          out_dir.joinpath('profile-name.txt').write_text(p['Name'])
          out_dir.joinpath('profile-uuid.txt').write_text(p['UUID'])
          out_dir.joinpath('device-count.txt').write_text(str(len(devices)))
          for i, cert in enumerate(certificates):
              out_dir.joinpath(f'profile-cert-{i}.der').write_bytes(bytes(cert))
          PY

          PRIVATE_PUB_SHA="$(openssl pkey -in "$PRIVATE_KEY" -pubout -outform DER 2>/dev/null | shasum -a 256 | awk '{print $1}')"
          MATCHED=0
          for cert_der in "$SIGN_DIR"/profile-cert-*.der; do
            cert_pem="${cert_der%.der}.pem"
            openssl x509 -inform DER -in "$cert_der" -out "$cert_pem"
            CERT_PUB_SHA="$(openssl x509 -in "$cert_pem" -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | shasum -a 256 | awk '{print $1}')"
            if [ "$CERT_PUB_SHA" = "$PRIVATE_PUB_SHA" ]; then
              cp "$cert_pem" "$MATCHING_CERT"
              MATCHED=1
              break
            fi
          done

          if [ "$MATCHED" -ne 1 ]; then
            echo 'The encrypted private key does not match any certificate embedded in the provisioning profile.' >&2
            exit 1
          fi

          CERT_SUBJECT="$(openssl x509 -in "$MATCHING_CERT" -noout -subject)"
          CERT_END="$(openssl x509 -in "$MATCHING_CERT" -noout -enddate)"
          echo "Matched signing certificate: ${CERT_SUBJECT}"
          echo "Certificate ${CERT_END}"
          echo "Provisioning profile: $(cat "$SIGN_DIR/profile-name.txt")"
          echo "Registered devices in profile: $(cat "$SIGN_DIR/device-count.txt")"

          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          # Import the RSA private key and matching Apple Development certificate
          # directly into a temporary keychain.
          PRIVATE_KEY_PKCS8="$SIGN_DIR/private-key.pkcs8.der"
          MATCHING_CERT_DER="$SIGN_DIR/development-cert.der"

          openssl pkcs8 \
            -topk8 \
            -nocrypt \
            -in "$PRIVATE_KEY" \
            -outform DER \
            -out "$PRIVATE_KEY_PKCS8"
          openssl x509 \
            -in "$MATCHING_CERT" \
            -outform DER \
            -out "$MATCHING_CERT_DER"

          # Re-verify the converted key still matches the certificate before
          # touching the macOS keychain.
          PKCS8_PUB_SHA="$(openssl pkey -inform DER -in "$PRIVATE_KEY_PKCS8" -pubout -outform DER 2>/dev/null | shasum -a 256 | awk '{print $1}')"
          CERT_PUB_SHA="$(openssl x509 -inform DER -in "$MATCHING_CERT_DER" -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | shasum -a 256 | awk '{print $1}')"
          test "$PKCS8_PUB_SHA" = "$CERT_PUB_SHA"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          # Import private key and certificate separately. This avoids the
          # PKCS#12 parser entirely.
          security import "$PRIVATE_KEY_PKCS8" \
            -k "$KEYCHAIN_PATH" \
            -t priv \
            -f pkcs8 \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security import "$MATCHING_CERT_DER" \
            -k "$KEYCHAIN_PATH" \
            -t cert \
            -f x509

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

          echo 'Code-signing identities in temporary keychain:'
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

          IDENTITY_COUNT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c 'Apple Development' || true)"
          if [ "$IDENTITY_COUNT" -lt 1 ]; then
            echo 'Private key and certificate imported, but macOS did not form an Apple Development identity.' >&2
            echo 'Certificate in keychain:' >&2
            security find-certificate -a -c 'Apple Development' -Z "$KEYCHAIN_PATH" || true
            exit 1
          fi

          PROFILE_UUID="$(cat "$SIGN_DIR/profile-uuid.txt")"
          PROFILE_NAME="$(cat "$SIGN_DIR/profile-name.txt")"
          PROFILE_DEST="$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          mkdir -p "$(dirname "$PROFILE_DEST")"
          cp "$PROFILE" "$PROFILE_DEST"

          rm -f "$PRIVATE_KEY" "$PRIVATE_KEY_PKCS8" "$MATCHING_CERT_DER"

          {
            echo "keychain_path=$KEYCHAIN_PATH"
            echo "profile_path=$PROFILE_DEST"
            echo "profile_name=$PROFILE_NAME"
            echo "profile_uuid=$PROFILE_UUID"
          } >> "$GITHUB_OUTPUT"

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Repository safety check
        run: npm run repo:check

      - name: TypeScript check
        run: npm run typecheck

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Archive signed Debug app
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/AutoSaleUmar-Debug.xcarchive"

          xcodebuild \
            -workspace ios/AutoSaleUmar.xcworkspace \
            -scheme "$APP_SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY='Apple Development' \
            COMPILER_INDEX_STORE_ENABLE=NO

          test -d "$ARCHIVE_PATH"
          test -d "$ARCHIVE_PATH/Products/Applications/AutoSaleUmar.app"

      - name: Export Development IPA
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/AutoSaleUmar-Debug.xcarchive"
          EXPORT_DIR="$RUNNER_TEMP/autosale-debug-export"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"

          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          cat > "$EXPORT_PLIST" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingCertificate</key>
            <string>Apple Development</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          plutil -lint "$EXPORT_PLIST"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_PLIST"

          IPA_SOURCE="$(find "$EXPORT_DIR" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_SOURCE"
          cp "$IPA_SOURCE" "$GITHUB_WORKSPACE/AutoSaleUmar-Debug.ipa"
          test -s "$GITHUB_WORKSPACE/AutoSaleUmar-Debug.ipa"

      - name: Verify exported IPA
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/verify-ipa"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q AutoSaleUmar-Debug.ipa -d "$VERIFY_DIR"

          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/embedded.mobileprovision"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test "$BUNDLE_ID" = "$APP_BUNDLE_ID"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > "$VERIFY_DIR/entitlements.plist" 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$VERIFY_DIR/entitlements.plist" | grep -qx 'true'

          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$VERIFY_DIR/embedded-profile.plist"
          EMBEDDED_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$VERIFY_DIR/embedded-profile.plist")"
          test "$EMBEDDED_NAME" = "$EXPECTED_PROFILE_NAME"

          IPA_SHA="$(shasum -a 256 AutoSaleUmar-Debug.ipa | awk '{print $1}')"
          IPA_SIZE="$(stat -f '%z' AutoSaleUmar-Debug.ipa)"
          {
            echo "Auto Sale Umar Debug IPA"
            echo "Bundle ID: $APP_BUNDLE_ID"
            echo "Team ID: $APPLE_TEAM_ID"
            echo "Provisioning profile: $EXPECTED_PROFILE_NAME"
            echo "SHA-256: $IPA_SHA"
            echo "Size bytes: $IPA_SIZE"
          } > DEBUG-IPA-INFO.txt

      - name: Upload signed Debug IPA
        uses: actions/upload-artifact@v7
        with:
          name: AutoSaleUmar-Debug-iPhone
          path: |
            AutoSaleUmar-Debug.ipa
            DEBUG-IPA-INFO.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove temporary signing material
        if: always()
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          PROFILE_PATH: ${{ steps.signing.outputs.profile_path }}
        run: |
          set +e
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [ -n "${PROFILE_PATH:-}" ]; then
            rm -f "$PROFILE_PATH"
          fi
          rm -rf "$RUNNER_TEMP/autosale-signing"
