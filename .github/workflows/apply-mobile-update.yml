# AUTO SALE UMAR — UPDATE UNPACKER ONLY
name: Auto Sale Umar — Apply Update

on:
  push:
    branches: [main]
    paths:
      - 'mobile-update.zip'

permissions:
  contents: write

concurrency:
  group: autosaleumar-apply-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-update:
    runs-on: macos-26
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration/update ZIP safely
        shell: python
        run: |
          import pathlib
          import shutil
          import stat
          import zipfile

          root = pathlib.Path('.').resolve()
          archive = root / 'mobile-update.zip'
          if not archive.exists():
              raise SystemExit('mobile-update.zip not found')

          staging = root / '.asu-update-staging'
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir()

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace('\\', '/')
                  parts = pathlib.PurePosixPath(name).parts
                  if not parts:
                      continue
                  if name.startswith('/') or '..' in parts:
                      raise SystemExit(f'Unsafe ZIP path: {name}')
                  if parts[0] in {'.git', '.github', 'Signing'}:
                      raise SystemExit(f'ZIP may not modify protected path: {name}')
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f'Symlink not allowed: {name}')
                  out = (staging / name).resolve()
                  if out != staging and staging not in out.parents:
                      raise SystemExit(f'Unsafe target: {name}')
              zf.extractall(staging)

          source = staging
          entries = [p for p in staging.iterdir()]
          if len(entries) == 1 and entries[0].is_dir() and not (staging / 'project.yml').exists():
              candidate = entries[0]
              if (candidate / 'project.yml').exists() or (candidate / 'Sources').exists():
                  source = candidate

          delete_file = source / 'DELETE.txt'
          if delete_file.exists():
              for raw in delete_file.read_text().splitlines():
                  rel = raw.strip()
                  if not rel or rel.startswith('#'):
                      continue
                  parts = pathlib.PurePosixPath(rel).parts
                  if rel.startswith('/') or '..' in parts or parts[0] in {'.git', '.github', 'Signing'}:
                      raise SystemExit(f'Unsafe DELETE path: {rel}')
                  target = (root / rel).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'Unsafe DELETE target: {rel}')
                  if target.is_dir():
                      shutil.rmtree(target)
                  elif target.exists():
                      target.unlink()
              delete_file.unlink()

          for item in source.iterdir():
              if item.name == 'DELETE.txt':
                  continue
              target = root / item.name
              if item.is_dir():
                  if target.exists() and not target.is_dir():
                      target.unlink()
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(item, target)

          shutil.rmtree(staging)
          archive.unlink()
          print('Native iOS update applied in workspace.')

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Xcode compile gate
        run: |
          set -o pipefail
          xcodebuild \
            -project AutoSaleUmar.xcodeproj \
            -scheme AutoSaleUmar \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Public-repository signing safety gate
        run: |
          set -euo pipefail
          rm -rf Signing
          if find . -path './.git' -prune -o -type f \
            \( -name '*.mobileprovision' -o -name '*.p12' -o -name '*.pem' -o -name '*.cer' -o -name 'distribution-private-key.enc' \) \
            -print | grep -q .; then
            echo 'Refusing to commit signing material to a public repository.'
            exit 1
          fi

      - name: Commit only verified native source
        run: |
          set -euo pipefail
          rm -rf AutoSaleUmar.xcodeproj Signing
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Apply verified Auto Sale Umar native iOS update'
          git pull --rebase origin main
          git push origin HEAD:main
