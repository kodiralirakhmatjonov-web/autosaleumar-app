name: Apply mobile-update.zip

on:
  push:
    branches:
      - main
    paths:
      - mobile-update.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autosaleumar-mobile-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-update:
    runs-on: ubuntu-latest

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect update archive
        id: archive
        shell: bash
        run: |
          if [ -f mobile-update.zip ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No mobile-update.zip. Running setup/check mode."
          fi

      - name: Extract update safely
        if: steps.archive.outputs.exists == 'true'
        shell: bash
        run: |
          rm -rf .mobile-update-tmp
          mkdir -p .mobile-update-tmp

          python3 - <<'PY'
          import pathlib
          import zipfile

          archive = pathlib.Path("mobile-update.zip")
          target = pathlib.Path(".mobile-update-tmp").resolve()

          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  out = (target / info.filename).resolve()
                  if out != target and target not in out.parents:
                      raise SystemExit(f"Unsafe ZIP path: {info.filename}")
              zf.extractall(target)
          PY

      - name: Apply update files
        if: steps.archive.outputs.exists == 'true'
        shell: bash
        run: |
          SOURCE=".mobile-update-tmp"

          shopt -s dotglob nullglob
          entries=(.mobile-update-tmp/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            candidate="${entries[0]}"
            if [ -f "$candidate/package.json" ] || [ -d "$candidate/app" ] || [ -d "$candidate/src" ]; then
              SOURCE="$candidate"
            fi
          fi

          echo "Applying files from: $SOURCE"

          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'mobile-update.zip' \
            "$SOURCE/" ./

          rm -rf .mobile-update-tmp

      - name: Detect whether native rebuild is required
        id: native
        if: steps.archive.outputs.exists == 'true'
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"

          requires_native=false

          while IFS= read -r file; do
            case "$file" in
              package.json|package-lock.json|app.json|app.config.*|eas.json|ios/*|android/*)
                requires_native=true
                ;;
            esac
          done <<< "$changed"

          echo "required=$requires_native" >> "$GITHUB_OUTPUT"

          if [ "$requires_native" = "true" ]; then
            echo "Native-impacting files changed. OTA publish will be skipped."
          else
            echo "JS/UI/assets-only update. Eligible for OTA publish."
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        shell: bash
        run: npm run typecheck --if-present

      - name: Verify Expo token
        if: env.EXPO_TOKEN != ''
        shell: bash
        run: npx eas-cli@latest whoami

      - name: Link project to Expo EAS
        if: env.EXPO_TOKEN != ''
        shell: bash
        run: |
          HAS_PROJECT_ID="$(node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          process.stdout.write(config?.expo?.extra?.eas?.projectId ? 'yes' : 'no');
          NODE
          )"

          if [ "$HAS_PROJECT_ID" = "yes" ]; then
            echo "EAS project is already linked."
          else
            echo "Linking AutoSale Umar to EAS..."
            npx eas-cli@latest init \
              --account kodiralirakhmatjonov \
              --force \
              --non-interactive
          fi

      - name: Configure EAS Update
        if: env.EXPO_TOKEN != ''
        shell: bash
        run: |
          HAS_UPDATE_URL="$(node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          process.stdout.write(config?.expo?.updates?.url ? 'yes' : 'no');
          NODE
          )"

          if [ "$HAS_UPDATE_URL" = "yes" ]; then
            echo "EAS Update is already configured."
          else
            npx eas-cli@latest update:configure \
              --platform ios \
              --environment development \
              --non-interactive
          fi

      - name: Final TypeScript check
        shell: bash
        run: npm run typecheck --if-present

      - name: Remove update archive
        if: steps.archive.outputs.exists == 'true'
        shell: bash
        run: rm -f mobile-update.zip

      - name: Commit verified repository state
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No repository changes to commit."
            exit 0
          fi

          git commit -m "Apply verified mobile update"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish development OTA update
        if: >
          steps.archive.outputs.exists == 'true' &&
          steps.native.outputs.required != 'true' &&
          env.EXPO_TOKEN != ''
        shell: bash
        run: |
          npx eas-cli@latest update \
            --channel development \
            --message "AutoSale Umar GitHub update ${GITHUB_SHA}" \
            --non-interactive

      - name: Update result
        shell: bash
        run: |
          echo "=========================================="
          echo "AutoSale Umar mobile pipeline completed."
          echo "Archive: ${{ steps.archive.outputs.exists }}"
          echo "Native rebuild required: ${{ steps.native.outputs.required }}"
          echo "=========================================="
